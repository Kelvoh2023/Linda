<style>
/* Layout: a real full-screen phone app. On a laptop it sits inside a device frame so it presents well on a projector. */
:root{
  --page:#E6EDE7; --bg:#F6F8F5; --card:#FFFFFF; --ink:#12201A; --muted:#5E6E65; --line:#DDE4DE;
  --green:#127A43; --green-soft:#DDF1E4; --red:#C5302B; --red-soft:#FBE3E1; --amber:#8A5F08; --amber-soft:#FBF0D5;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --f-body:"Figtree","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}

.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.sbfake{display:none;justify-content:space-between;align-items:center;padding:10px 24px 4px;font-size:12px;font-weight:600;position:relative}
.sbfake i{position:absolute;left:50%;top:9px;width:11px;height:11px;border-radius:50%;background:#0B0F0D;transform:translateX(-50%)}
@media (min-width:600px){
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%}
  .app{position:relative;inset:auto;width:392px;height:min(840px,calc(100dvh - 64px));min-height:640px;border:10px solid #0B0F0D;border-radius:48px;box-shadow:0 30px 60px -28px rgba(0,0,0,.55);padding-top:0}
  .sbfake{display:flex}
  .below{display:block!important}
}
.below{display:none;margin-top:14px;font-size:13px;color:var(--muted);text-align:center;max-width:46ch}
.below a{color:var(--green);font-weight:700}

.view{flex:1;min-height:0;overflow-y:auto;padding:8px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.hd{display:flex;align-items:center;gap:10px;padding-top:6px}
.hd h2{font-size:24px;font-weight:800;letter-spacing:-.02em;flex:1}
.logo{width:36px;height:36px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.pill-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.pill-btn b{color:var(--green)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
.lang button{border:0;background:none;padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--green);color:#fff}

.nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button[aria-current="true"]{color:var(--green)}
.nav svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.status{background:var(--green);color:#fff;border:0;display:flex;flex-direction:column;gap:6px}
.status h3{font-size:19px;font-weight:800}
.status p{margin:0;font-size:13px;opacity:.92}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9CF0BF;margin-right:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px}
.stat b{font-family:var(--f-mono);font-size:24px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sec{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:4px 2px 0}
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.row .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--line);color:var(--muted)}
.row .tx{min-width:0;flex:1}
.row .tx b{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.row .tx b small{font-weight:500;color:var(--muted);font-size:11px;white-space:nowrap}
.row .tx p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.bad{border-color:var(--red);background:var(--red-soft)}
.row.bad .av{background:var(--red);color:#fff}
.row.warn{border-color:#E5B13C;background:var(--amber-soft)}
.row.good .av{background:var(--green-soft);color:var(--green)}
button.row{cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-top:4px}
.tag.red{background:var(--red);color:#fff}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.grey{background:var(--line);color:var(--muted)}
.back{border:0;background:none;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--green);padding:4px 0;width:fit-content}
.msgbox{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.msgbox mark{background:var(--red-soft);color:var(--red);font-weight:700;border-radius:4px;padding:0 2px}
.vd{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:9px}
.vd.scam{background:var(--red-soft);border:1px solid var(--red)}
.vd.caution{background:var(--amber-soft);border:1px solid #E5B13C}
.vd.ok{background:var(--green-soft);border:1px solid #A7D9B9}
.vd h3{font-size:18px;font-weight:800;display:flex;gap:8px;align-items:center}
.vd.scam h3{color:var(--red)} .vd.caution h3{color:var(--amber)} .vd.ok h3{color:var(--green)}
.vd ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.vd h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:700}
.score{font-family:var(--f-mono);font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--card);margin-left:auto;color:var(--ink);border:1px solid var(--line)}
.words{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;font-weight:700;font-size:13px;color:var(--ink)}
.btn.p{background:var(--green);color:#fff;border-color:var(--green)}
.btn.r{background:var(--red);color:#fff;border-color:var(--red)}
.btn.w{flex:1}
.btn[disabled]{opacity:.55;cursor:default}

.chat{display:flex;flex-direction:column;gap:10px;flex:1}
.bub{max-width:92%;padding:10px 12px;border-radius:16px;font-size:13.5px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.bub.li{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;width:92%}
.bub.li.plain{width:auto}
.bub .vd{border:0;padding:0;background:none!important}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink);text-align:left}
.askbar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--card)}
.askbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
.askbar button{border:0;background:var(--green);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}

.layer{display:flex;gap:12px;align-items:flex-start}
.layer .n{width:28px;height:28px;border-radius:9px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;flex:none}
.layer p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.mstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mstat div{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.mstat b{font-family:var(--f-mono);font-size:18px;display:block}
.mstat span{font-size:11px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}
a.link{color:var(--green);font-weight:700}

#ov{position:absolute;inset:0;pointer-events:none;z-index:20}
#ov>*{pointer-events:auto}
.notif{position:absolute;left:10px;right:10px;top:34px;background:var(--card);color:var(--ink);border-radius:20px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;gap:10px;text-align:left;border:0;width:calc(100% - 20px);animation:drop .35s ease}
.notif .logo{width:30px;height:30px;border-radius:10px;background:var(--red)}
.notif b{font-size:13px;display:block}
.notif span{font-size:12.5px;color:var(--muted)}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.call{position:absolute;inset:0;background:#0E1812;color:#fff;display:flex;flex-direction:column;align-items:center;padding:52px 22px 26px;gap:10px;text-align:center}
.call .top{font-size:12px;opacity:.7;letter-spacing:.04em}
.call .avt{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin-top:14px;background:#26332B}
.call .avt svg{width:40px;height:40px}
.call h2{font-size:25px;font-weight:800;margin-top:6px}
.call .num{font-family:var(--f-mono);font-size:14px;opacity:.75}
.badge{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13.5px;margin-top:6px}
.badge.red{background:var(--red);color:#fff}.badge.green{background:#1FA45E;color:#fff}.badge.amber{background:#E5B13C;color:#2B1E00}.badge.grey{background:#3A4640;color:#fff}
.call .sub{font-size:13.5px;opacity:.85;max-width:28ch;margin:2px 0 0}
.call .sp{flex:1}
.acts{display:flex;justify-content:space-between;width:100%;padding:0 18px;align-items:center}
.circ{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff}
.circ.g{background:#1FA45E}.circ.r{background:#D8403A}
.circ svg{width:28px;height:28px}
.call .rep{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:9px 15px;font-weight:700;font-size:13px;margin-bottom:10px}
.call .rep[disabled]{opacity:.6}
.ban{border-radius:16px;padding:12px;font-size:13.5px;text-align:left;width:100%;margin-top:10px}
.ban.red{background:var(--red-soft);color:var(--red)}.ban.green{background:var(--green-soft);color:var(--green)}.ban.amber{background:var(--amber-soft);color:var(--amber)}
.ban b{display:block;margin-bottom:2px}
.timer{font-family:var(--f-mono);font-size:15px;opacity:.85}
.stk{position:absolute;left:18px;right:18px;top:200px;background:#F2F3F2;color:#1A1D1B;border-radius:24px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:left;animation:drop .3s ease}
.stk h4{margin:0 0 6px;font-size:15px;font-weight:700;font-family:var(--f-body)}
.stk p{margin:0;font-size:14px}
.stk .pin{margin:12px 0;border-bottom:2px solid #1A1D1B;letter-spacing:8px;font-family:var(--f-mono);height:28px;color:#777}
.stk .tb{display:flex;justify-content:flex-end;gap:18px;font-weight:700;font-size:14px;color:#1A5C37}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;text-align:left;animation:rise .35s ease}
.sheet h3{font-size:20px;font-weight:800}
.sheet.red h3{color:var(--red);display:flex;gap:8px;align-items:center}
.sheet p{margin:0;font-size:14px}
.scrim{position:absolute;inset:0;background:rgba(10,16,12,.45)}
.demo-list{display:flex;flex-direction:column;gap:8px}
.demo-list button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;text-align:left;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.demo-list button b{font-family:var(--f-mono);color:var(--green);font-size:12px}
.toast{position:absolute;left:18px;right:18px;bottom:78px;background:#17211B;color:#fff;border-radius:14px;padding:11px 14px;font-size:13px;font-weight:600;text-align:center;animation:rise .25s ease;z-index:30}
.tag.blue{background:#E1ECFA;color:#1A5FB4}
.badge.blue{background:#2B6CC4;color:#fff}
.row.sos{border-color:var(--red);background:var(--red-soft)}
.row.sos .av{background:var(--red);color:#fff}
.row.sos .tx p{white-space:normal}
.btn.sos{background:var(--red);color:#fff;border-color:var(--red);width:100%;display:flex;gap:8px;align-items:center;justify-content:center;padding:11px 14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opts button{border:1px solid var(--green);background:var(--card);color:var(--green);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px;text-align:left}
.opts button:hover{background:var(--green-soft)}
.opts button.skip{border-color:var(--line);color:var(--muted)}
.bub.li.err{border-color:#E5B13C;background:var(--amber-soft)}
.steps{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:8px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.steps b{font-size:13.5px;display:block}
.steps small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.res h3{font-size:16px;font-weight:800;margin:2px 0 0}
.res .urgent{background:var(--red-soft);color:var(--red);border-radius:12px;padding:9px 11px;font-size:13px;font-weight:600}
.res .cov{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:9px 11px;font-size:12.5px}
.report{margin:6px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.sheet{max-height:88%;overflow-y:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

        var st = FL.stepById(c.flowQ), active = cur && cur.id === st.id && idx === last;
        h += '<div class="bub li plain">' + esc(st.q[S.lang]);
        if (active && st.type === "choice") h += '<div class="opts">' + st.options().map(function (o) { return '<button data-a="flowopt" data-v="' + o.v + '">' + esc(o[S.lang]) + "</button>"; }).join("") + "</div>";
        if (active && st.type === "text" && st.optional) h += '<div class="opts"><button class="skip" data-a="flowskip">' + t("skip") + "</button></div>";
        h += "</div>";
      }
      else if (c.flowDone) h += '<div class="bub li">' + resultHTML() + "</div>";
      else if (c.res) h += '<div class="bub li">' + verdictHTML(c.res) + "</div>";
    });
    return h + "</div>";
  }
  function vAbout() {
    var st = M.stats;
    return '<button class="back" data-a="tab" data-v="home">' + I.back + " " + t("home") + "</button><h2>" + t("how") + "</h2>" +
      [["1", "l1"], ["2", "l2"], ["3", "l3"]].map(function (x) { return '<div class="card layer"><div class="n">' + x[0] + "</div><div><b>" + t(x[1]) + "</b><p>" + t(x[1] + "d") + "</p></div></div>"; }).join("") +
      '<div class="mstat"><div><b>' + st.total + "</b><span>" + t("mTrain") + "</span></div><div><b>" + st.features + "</b><span>" + t("mWords") + "</span></div><div><b>" + Math.round(st.cv * 100) + "%</b><span>" + t("mCv") + "</span></div></div>" +
      '<p class="fine">' + t("mNote") + "</p><h2>" + t("cov") + "</h2>" +
      [["1", "cov1"], ["2", "cov2"], ["3", "cov3"]].map(function (x) { return '<div class="card layer"><div class="n">' + x[0] + "</div><div><b>" + t(x[1]) + "</b><p>" + t(x[1] + "d") + "</p></div></div>"; }).join("") +
      '<a class="link" href="dashboard.html">' + t("console") + "</a>";
  }
  function renderNav() {
    var tabs = [["home", t("home"), I.home], ["msgs", t("msgs"), I.msg], ["calls", t("calls"), I.phone], ["ask", t("ask"), I.spark]];
    $("#nav").innerHTML = tabs.map(function (x) { return '<button data-a="tab" data-v="' + x[0] + '"' + (S.tab === x[0] || (S.tab === "about" && x[0] === "home") ? ' aria-current="true"' : "") + ">" + x[2] + x[1] + "</button>"; }).join("");
  }
  function render(keepScroll) {
    var v = $("#view"), top = v.scrollTop;
    var h = S.tab === "home" ? vHome() : S.tab === "msgs" ? vMsgs() : S.tab === "calls" ? vCalls() : S.tab === "ask" ? vAsk() : vAbout();
    v.innerHTML = h; v.scrollTop = keepScroll ? top : 0;
    var old = $("#askbar"), keep = old && $("#askInput") ? $("#askInput").value : ""; if (old) old.remove();
    if (S.tab === "ask") {
      var cs = curStep(), ph = cs && cs.type === "text" ? cs.ph[S.lang] : t("askPh");
      var bar = document.createElement("div"); bar.className = "askbar"; bar.id = "askbar";
      bar.innerHTML = '<input id="askInput" type="text" placeholder="' + esc(ph) + '" autocomplete="off"><button data-a="ask" aria-label="Send">' + I.send + "</button>";
      $("#nav").parentNode.insertBefore(bar, $("#nav"));
      if (keep) $("#askInput").value = keep;
    }
    renderNav();
  }
  function toBottom() { var v = $("#view"); v.scrollTop = v.scrollHeight; }

  /* ---------- overlays ---------- */
  function renderOv() {
    var o = S.ov, h = "";
    if (S.sheet === "demo") {
      h += '<div class="scrim" data-a="closesheet"></div><div class="sheet"><h3>' + t("demoTitle") + '</h3><p class="fine">' + t("demoSub") + '</p><div class="demo-list">' +
        [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return '<button data-a="scn" data-v="' + n + '"><b>' + n + "</b>" + t("s" + n) + "</button>"; }).join("") +
        '</div><div class="btns"><a class="btn w link" style="text-align:center;text-decoration:none" href="dashboard.html">' + t("console") + '</a><button class="btn w" data-a="reset">' + t("reset") + '</button></div><button class="btn" data-a="closesheet">' + t("close") + "</button></div>";
    }
    if (o && o.type === "notif") {
      var two = o.id === "m5";
      h += '<button class="notif" data-a="opennotif"><div class="logo">' + I.alert + "</div><div><b>" + t(two ? "notif2T" : "notifT") + "</b><span>" + t(two ? "notif2S" : "notifS") + "</span></div></button>";
    }
    if (o && o.type === "call") {
      var ci = callInfo(o.n), reported = S.done["c" + o.n], showNum = ci.tone === "green" || ci.tone === "blue";
      var repBtn = !showNum ? '<button class="rep" data-a="reportcall" data-v="' + esc(o.n) + '"' + (reported ? " disabled" : "") + ">" + (reported ? t("reported") : t("repNum")) + "</button>" : "";
      if (!o.answered) {
        h += '<div class="call"><div class="top">' + t("incoming") + '</div><div class="avt">' + I.user + "</div><h2>" + esc(ci.title) + "</h2>" + (showNum ? '<div class="num">' + esc(o.n) + "</div>" : "") +
          '<div class="badge ' + ci.tone + '">' + ci.badge + '</div><p class="sub">' + esc(ci.sub) + '</p><div class="sp"></div>' + repBtn +
          '<div class="acts"><button class="circ r" data-a="decline" aria-label="' + t("decline") + '">' + I.end + '</button><button class="circ g" data-a="answer" aria-label="' + t("answer") + '">' + I.phone + "</button></div></div>";
      } else {
        var b = ci.tone === "red" ? ["red", t("bNoPin"), t("bNoPinSub")] : ci.tone === "green" ? ["green", t("bVer"), t("bVerSub")] : ci.tone === "blue" ? ["green", t("bContact"), t("bContactSub")] : ci.tone === "amber" ? ["amber", t("bCare"), t("bCareSub")] : ["amber", t("bUnk"), t("bUnkSub")];
        h += '<div class="call"><div class="top">' + t("inCall") + '</div><div class="avt">' + I.user + "</div><h2>" + esc(ci.title) + '</h2><div class="timer" id="tm">00:00</div><div class="ban ' + b[0] + '"><b>' + b[1] + "</b>" + b[2] + '</div><div class="sp"></div>' + repBtn +
          '<div class="acts" style="justify-content:center"><button class="circ r" data-a="decline" aria-label="End call">' + I.end + "</button></div></div>";
        if (o.stk) h += '<div class="stk"><h4>M-PESA</h4><p>Pay KSh 4,500.00 to JOHN KAMAU 0711 000 412?<br>Enter M-PESA PIN.</p><div class="pin">• • • •</div><div class="tb"><span>Cancel</span><span>OK</span></div></div>';
        if (o.sheet) h += '<div class="sheet red"><h3>' + I.alert + " " + t("stop") + "</h3><p>" + t("stopSub") + '</p><div class="btns"><button class="btn r w" data-a="pincancel">' + t("cancelPay") + '</button><button class="btn w" data-a="pinok">' + t("knowThem") + "</button></div></div>";
      }
    }
    $("#ov").innerHTML = h;
  }
  function toast(x) {
    var el = document.createElement("div"); el.className = "toast"; el.textContent = x; $("#app").appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }
  function startTimer() {
    var s = 0, iv = setInterval(function () {
      var el = $("#tm"); if (!el || !S.ov || !S.ov.answered) { clearInterval(iv); return; }
      s++; el.textContent = "00:" + (s < 10 ? "0" + s : s);
    }, 1000); timers.push(iv);
  }

  /* ---------- the "I've been scammed" steps ---------- */
  function lookupRec(num) {
    var k = Shared.findKey(S.shared.db, num), r = k ? S.shared.db[k] : null;
    return r && r.status !== "verified" ? { status: r.status, count: r.count } : null;
  }
  function flowStart() {
    clearTimers(); S.ov = null; S.sheet = null; S.msg = null; S.tab = "ask";
    S.flow = { data: {}, done: false }; S.chat = [{ flowIntro: true }, { flowQ: "kind" }];
    render(); renderOv();
  }
  function flowAdvance() {
    var nx = FL.next(S.flow.data);
    if (nx) S.chat.push({ flowQ: nx.id });
    else { S.flow.done = true; S.flow.result = FL.build(S.flow.data, lookupRec, new Date()); S.chat.push({ flowDone: true }); }
    render(); toBottom();
  }
  function flowChoice(v) {
    var st = curStep(); if (!st) return;
    var o = st.options().filter(function (x) { return x.v === v; })[0];
    S.flow.data[st.id] = v; S.chat.push({ me: o[S.lang] }); flowAdvance();
  }
  function flowSkip() { var st = curStep(); if (!st) return; S.flow.data[st.id] = null; S.chat.push({ me: t("skip") }); flowAdvance(); }
  function flowText(text) {
    var st = curStep(); if (!st) return;
    S.chat = S.chat.filter(function (c) { return !c.flowErr; });
    var shown = text.length > 70 ? text.slice(0, 70) + "..." : text;
    if (!FL.answerText(S.flow.data, st, text)) { S.chat.push({ me: shown }, { flowErr: st.id }); render(); toBottom(); return; }
    S.chat.push({ me: shown }); flowAdvance();
  }
  function copyReport() {
    var txt = S.flow && S.flow.result ? S.flow.result.text : "";
    function manual() {
      try { var el = $("#reportText"), r = document.createRange(); r.selectNodeContents(el); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (e) {}
      toast(t("copyManual"));
    }
    try { navigator.clipboard.writeText(txt).then(function () { toast(t("copied")); }, manual); } catch (e) { manual(); }
  }
  function sendCase() {
    var r = S.flow.result, d = S.flow.data;
    function line(l) { var x = r.lines.filter(function (y) { return y[0] === l; })[0]; return x ? x[1] : ""; }
    S.shared = Shared.addCase({ ref: r.ref, type: FL.KINDS[d.kind].label, amount: d.amount || null, code: d.code || null, when: line("When"), who: d.who || null });
    if (d.who && /\d{4}/.test(d.who)) S.shared = Shared.report(d.who, "other");
    S.flow.sent = true; S.reports++; toast(t("caseSent")); render(true);
  }

  /* ---------- actions ---------- */
  function doReport(n, type, doneKey) {
    S.shared = Shared.report(n, type); S.reports++; S.done[doneKey] = true;
    toast(t("sentToTeam")); render(true); renderOv();
  }
  function callOpen(n, pin) { S.sheet = null; S.ov = { type: "call", n: n, answered: false, pin: !!pin }; renderOv(); }
  function ask(text) {
    if (flowActive()) { S.flow = null; S.chat = S.chat.filter(function (c) { return !c.flowIntro && !c.flowQ && !c.flowErr; }); }
    S.tab = "ask"; S.msg = null; S.sheet = null; renderOv();
    S.chat = S.chat.filter(function (c) { return !c.typing; });
    S.chat.push({ me: text }, { typing: true }); render(); toBottom();
    later(function () {
      S.chat = S.chat.filter(function (c) { return !c.typing; });
      S.chat.push({ res: analyzeAsk(text), text: text }); render(); toBottom();
    }, 700);
  }
  function analyzeAsk(text) {
    if (/^[\d\s+\-()]{3,16}$/.test(text.trim())) {
      var key = Shared.findKey(S.shared.db, text.trim()), d = key ? S.shared.db[key] : null, ct = contactOf(text.trim());
      if (d && d.status === "verified") return { level: "ok", score: 2, reasons: [{ k: "vernum" }], showWhy: true, words: [], steps: ["careful"] };
      if (d && d.status === "confirmed") return { level: "scam", score: 99, reasons: [{ k: "list", n: key, c: d.count }], words: [], steps: ["nosend", "nopin", "fwd333"] };
      if (d) return { level: "caution", score: 70, reasons: [{ k: "pending", n: key, c: d.count }], words: [], steps: ["nopin", "verify"] };
      if (ct) return { level: "ok", score: 4, reasons: [], words: [], steps: ["careful"] };
      return { level: "caution", score: 40, reasons: [{ k: "unknownnum" }], words: [], steps: ["verify", "nopin"] };
    }
    return M.scan(text, { db: S.shared.db, contacts: CONTACTS });
  }
  function act(a, v, el) {
    if (a === "tab") { S.tab = v; S.msg = null; render(); }
    else if (a === "lang") { S.lang = v; try { localStorage.setItem("linda_lang", v); } catch (e) {} render(true); renderOv(); }
    else if (a === "demo") { S.sheet = "demo"; renderOv(); }
    else if (a === "closesheet") { S.sheet = null; renderOv(); }
    else if (a === "openmsg") { S.tab = "msgs"; S.msg = v; if (S.ov && S.ov.type === "notif") S.ov = null; S.sheet = null; renderOv(); render(); }
    else if (a === "opennotif") { act("openmsg", (S.ov && S.ov.id) || "m2"); }
    else if (a === "closemsg") { S.msg = null; render(); }
    else if (a === "toast") { toast(t(v)); }
    else if (a === "reportmsg") { var m = MSGS.filter(function (x) { return x.id === v; })[0], r = scanMsg(m); doReport(/^[\d\s]+$/.test(m.from) ? m.from : (m.id === "m3" ? "0722 000 318" : m.from), typeOf(r, m.body), m.id); }
    else if (a === "reportcall") { var ci = callInfo(v); doReport(v, ci.d ? ci.d.type : "other", "c" + v); }
    else if (a === "callnum") { callOpen(v); }
    else if (a === "answer") {
      S.ov.answered = true; renderOv(); startTimer();
      if (S.ov.pin) {
        later(function () { if (S.ov && S.ov.answered) { S.ov.stk = true; renderOv(); } }, 2800);
        later(function () { if (S.ov && S.ov.stk) { S.ov.sheet = true; renderOv(); } }, 3900);
      }
    }
    else if (a === "decline") { S.ov = null; clearTimers(); renderOv(); }
    else if (a === "pincancel") { doReport("0711 000 412", "reversal", "c0711 000 412"); S.ov = null; clearTimers(); renderOv(); toast(t("payCancelled")); }
    else if (a === "pinok") { S.ov.sheet = false; renderOv(); toast(t("watching")); }
    else if (a === "chip") { ask(SUGG[+v]); }
    else if (a === "ask") {
      var i = $("#askInput"); if (!i || !i.value.trim()) return;
      var x = i.value.trim(), cs = curStep();
      if (cs && cs.type === "choice") { toast(t("tapOption")); return; }
      i.value = "";
      if (cs) flowText(x); else ask(x);
    }
    else if (a === "flowstart") { flowStart(); }
    else if (a === "flowstop") { S.flow = null; S.chat = []; render(); }
    else if (a === "flowopt") { flowChoice(v); }
    else if (a === "flowskip") { flowSkip(); }
    else if (a === "copycase") { copyReport(); }
    else if (a === "sendcase") { sendCase(); }
    else if (a === "scn") { scenario(+v); }
    else if (a === "reset") { S.shared = Shared.reset(); S.done = {}; S.reports = 0; S.chat = []; S.flow = null; S.ov = null; S.sheet = null; S.msg = null; clearTimers(); render(); renderOv(); toast("OK"); }
  }
  function scenario(n) {
    clearTimers(); S.ov = null; S.msg = null; S.sheet = null; S.tab = "home"; render();
    if (n === 1) { S.tab = "msgs"; render(); S.ov = { type: "notif", id: "m2" }; renderOv(); }
    else if (n === 2) callOpen("0711 000 412");
    else if (n === 3) callOpen("100");
    else if (n === 4) callOpen("0745 000 777");
    else if (n === 5) callOpen("0711 000 412", true);
    else if (n === 6) callOpen("0722 555 101");
    else if (n === 7) { S.tab = "msgs"; render(); S.ov = { type: "notif", id: "m5" }; renderOv(); }
    else if (n === 8) flowStart();
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
    act(b.dataset.a, b.dataset.v, b);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "askInput") { e.preventDefault(); act("ask"); }
  });
  Shared.onChange(function (s) {
    var before = S.shared; S.shared = s;
    Object.keys(s.db).forEach(function (k) {
      var b = before.db[k];
      if (b && b.status !== "confirmed" && s.db[k].status === "confirmed") toast(t("confirmedNow").replace("{n}", k));
    });
    render(true); renderOv();
  });
  function tick() { var d = new Date(), el = $("#clk"); if (el) el.textContent = Shared.fmtTime(d.getTime()); }
  tick(); setInterval(tick, 30000);
  render(); renderOv();

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {} });
  }
})();
</script>
